# Minimal bring-up peripherals. Audio, RTC, IMU, and removable storage are
# intentionally deferred until the display and touch path is proven.
peripherals:
  - name: i2c_master
    type: i2c
    role: master
    config:
      port: 0
      pins:
        sda: 15
        scl: 14

  - name: spi_display
    type: spi
    role: master
    config:
      spi_bus_config:
        spi_port: SPI2_HOST
        mosi_io_num: 4
        miso_io_num: 5
        quadwp_io_num: 6
        quadhd_io_num: 7
        sclk_io_num: 11
        max_transfer_sz: 16400
