<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Watch Robots UI Mockup</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      background: #111;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 30% 10%, rgba(42,114,255,.25), transparent 28rem),
        radial-gradient(circle at 80% 90%, rgba(0,224,166,.12), transparent 22rem),
        #080a0f;
      color: white;
    }
    .wrap {
      display: flex;
      gap: 28px;
      align-items: flex-start;
      padding: 28px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .phone {
      width: 410px;
      height: 502px;
      border-radius: 54px;
      padding: 18px;
      background: #05070b;
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 30px 90px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.04);
    }
    .screen {
      width: 100%;
      height: 100%;
      border-radius: 42px;
      overflow: hidden;
      position: relative;
      background: #07090f;
    }
    .status {
      position: absolute;
      left: 22px;
      right: 22px;
      top: 12px;
      height: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: rgba(255,255,255,.72);
      font-size: 13px;
      letter-spacing: .2px;
      z-index: 5;
    }
    .page {
      height: 100%;
      padding: 42px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .title {
      font-size: 27px;
      font-weight: 760;
      letter-spacing: -.6px;
    }
    .pill {
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      display: inline-flex;
      gap: 7px;
      align-items: center;
      font-weight: 750;
      font-size: 12px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.06);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #62ff9a;
      box-shadow: 0 0 14px #62ff9a;
    }
    .off .dot { background: #ff5a66; box-shadow: 0 0 12px #ff5a66; }
    .hero {
      position: relative;
      flex: 1;
      min-height: 0;
      border-radius: 32px;
      background:
        radial-gradient(circle at 50% 35%, rgba(70,118,255,.42), transparent 36%),
        linear-gradient(180deg, #10192a, #080b11 76%);
      border: 1px solid rgba(255,255,255,.08);
      overflow: hidden;
    }
    .hero:before {
      content: "";
      position: absolute;
      inset: 18px 20px auto;
      height: 72px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(255,255,255,.14), rgba(255,255,255,.02));
      filter: blur(12px);
    }
    .robot {
      position: absolute;
      left: 50%;
      top: 47%;
      width: 230px;
      height: 230px;
      transform: translate(-50%, -50%);
      object-fit: contain;
      filter: drop-shadow(0 18px 24px rgba(0,0,0,.72)) drop-shadow(0 0 18px rgba(102,159,255,.22));
    }
    .robot-css {
      position: absolute;
      left: 50%;
      top: 48%;
      width: 110px;
      height: 250px;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 22px 26px rgba(0,0,0,.65));
    }
    .robot-css .head,
    .robot-css .body,
    .robot-css .arm,
    .robot-css .leg {
      position: absolute;
      background: linear-gradient(135deg, #f4f6fa, #8e98a6 55%, #262b34);
      border: 1px solid rgba(255,255,255,.7);
      box-shadow: inset -7px -10px 18px rgba(0,0,0,.35), inset 8px 8px 15px rgba(255,255,255,.42);
    }
    .robot-css .head { left: 36px; top: 3px; width: 39px; height: 46px; border-radius: 19px 19px 15px 15px; }
    .robot-css .body { left: 30px; top: 55px; width: 52px; height: 88px; border-radius: 24px 24px 18px 18px; }
    .robot-css .arm { top: 66px; width: 20px; height: 92px; border-radius: 14px; }
    .robot-css .arm.l { left: 4px; transform: rotate(8deg); }
    .robot-css .arm.r { right: 4px; transform: rotate(-8deg); }
    .robot-css .leg { top: 144px; width: 24px; height: 98px; border-radius: 16px; }
    .robot-css .leg.l { left: 25px; transform: rotate(5deg); }
    .robot-css .leg.r { right: 25px; transform: rotate(-5deg); }
    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .metric {
      height: 78px;
      border-radius: 24px;
      padding: 13px 14px;
      background: rgba(255,255,255,.075);
      border: 1px solid rgba(255,255,255,.08);
    }
    .metric .k {
      color: rgba(255,255,255,.54);
      font-size: 12px;
      font-weight: 650;
      text-transform: uppercase;
      letter-spacing: .4px;
    }
    .metric .v {
      margin-top: 5px;
      font-size: 25px;
      font-weight: 820;
      letter-spacing: -.4px;
    }
    .metric .v small {
      font-size: 14px;
      color: rgba(255,255,255,.62);
    }
    .strip {
      height: 92px;
      border-radius: 28px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.06);
    }
    .strip .cell {
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.035);
      text-align: center;
    }
    .cell b { font-size: 24px; }
    .cell span { display:block; margin-top:4px; font-size: 11px; color: rgba(255,255,255,.52); }
    .caption {
      width: 410px;
      text-align: center;
      color: rgba(255,255,255,.62);
      font-size: 14px;
      margin-top: 10px;
    }
    .option { display: flex; flex-direction: column; align-items: center; }
    .footer {
      display: flex;
      justify-content: center;
      gap: 8px;
      height: 10px;
    }
    .bar {
      width: 24px; height: 4px; border-radius: 9px;
      background: rgba(255,255,255,.25);
    }
    .bar.active { width: 42px; background: white; }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="option">
      <div class="phone">
        <div class="screen">
          <div class="status"><span>WiFi -52</span><span>73%</span></div>
          <div class="page">
            <div class="top">
              <div class="title">老大</div>
              <div class="pill"><span class="dot"></span>ONLINE</div>
            </div>
            <div class="hero">
              <img class="robot" src="/tmp/g1_robot_cutout_186_preview.png" alt="robot" />
            </div>
            <div class="metric-grid">
              <div class="metric"><div class="k">Battery</div><div class="v">70<small>%</small></div></div>
              <div class="metric"><div class="k">Joint Temp</div><div class="v">39-60<small>℃</small></div></div>
              <div class="metric"><div class="k">Motor Err</div><div class="v">0</div></div>
              <div class="metric"><div class="k">Source</div><div class="v">Live</div></div>
            </div>
            <div class="footer"><span class="bar active"></span><span class="bar"></span></div>
          </div>
        </div>
      </div>
      <div class="caption">方案 A：Apple Watch 风格，大图 + 2x2 指标卡</div>
    </section>

    <section class="option">
      <div class="phone">
        <div class="screen">
          <div class="status"><span>WiFi -52</span><span>73%</span></div>
          <div class="page">
            <div class="top">
              <div class="title">老大</div>
              <div class="pill"><span class="dot"></span>LIVE</div>
            </div>
            <div class="hero">
              <div class="robot-css">
                <i class="head"></i><i class="body"></i><i class="arm l"></i><i class="arm r"></i><i class="leg l"></i><i class="leg r"></i>
              </div>
            </div>
            <div class="strip">
              <div class="cell"><div><b>70%</b><span>BAT</span></div></div>
              <div class="cell"><div><b>60℃</b><span>MAX TEMP</span></div></div>
              <div class="cell"><div><b>0</b><span>MOTOR ERR</span></div></div>
            </div>
            <div class="footer"><span class="bar active"></span><span class="bar"></span></div>
          </div>
        </div>
      </div>
      <div class="caption">方案 B：不用照片，纯 UI 绘制机器人，更干净但不如 Web 原图准确</div>
    </section>

    <section class="option">
      <div class="phone">
        <div class="screen">
          <div class="status"><span>WiFi -52</span><span>73%</span></div>
          <div class="page off">
            <div class="top">
              <div class="title">老二</div>
              <div class="pill"><span class="dot"></span>OFFLINE</div>
            </div>
            <div class="hero" style="opacity:.72; filter:saturate(.45)">
              <img class="robot" src="/tmp/g1_robot_cutout_186_preview.png" alt="robot" />
            </div>
            <div class="metric-grid">
              <div class="metric"><div class="k">Battery</div><div class="v">--</div></div>
              <div class="metric"><div class="k">Joint Temp</div><div class="v">--</div></div>
              <div class="metric"><div class="k">Motor Err</div><div class="v">--</div></div>
              <div class="metric"><div class="k">Status</div><div class="v">OFF</div></div>
            </div>
            <div class="footer"><span class="bar"></span><span class="bar active"></span></div>
          </div>
        </div>
      </div>
      <div class="caption">离线页效果：同一套横滑页面，图变暗，状态清楚</div>
    </section>
  </div>
</body>
</html>
